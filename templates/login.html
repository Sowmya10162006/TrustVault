<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustVault | Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #173b68;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
            color: #334155;
        }

        input {
            box-sizing: border-box;

            width: 100%;
            padding: 11px;

            margin-top: 7px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #173b68;
        }

        button {
            width: 100%;

            margin-top: 24px;
            padding: 12px;

            background: #173b68;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #24558e;
        }

        .register {
            margin-top: 20px;
            text-align: center;

            font-size: 14px;
            color: #64748b;
        }

        .register a {
            color: #173b68;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>TrustVault</h1>

        <p class="subtitle">
            Secure Document Storage
        </p>

        <form method="POST" action="/login">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="register">
            Don't have an account?
            <a href="/register">Register here</a>
        </p>

    </div>

</body>
</html>
